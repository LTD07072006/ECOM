services:
  retention:
    profiles: ["retention"]
    build:
      context: .
      target: maintenance
    restart: unless-stopped
    command: ["bun", "run", "db:retention:scheduler"]
    environment:
      ECOM_RETENTION_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "db:retention:monitor"]
      interval: 5m
      timeout: 15s
      start_period: 2m
      retries: 2
  db:
    image: postgis/postgis:16-3.4
    container_name: ${ECOM_DB_CONTAINER:-vietnam-investor-platform-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_entry
      POSTGRES_USER: market_entry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:${ECOM_DB_PORT:-55432}:5432"
    volumes:
      - market_entry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_entry -d market_entry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market_entry_pgdata:
