services:
  app:
    profiles: ["app"]
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ECOM_APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://market_entry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}@db:5432/market_entry
      ECOM_OPERATORS: ${ECOM_OPERATORS:-}
      ECOM_REQUIRE_NAMED_OPERATORS: ${ECOM_REQUIRE_NAMED_OPERATORS:-1}
      ECOM_TRUSTED_PROXY_TOKEN: ${ECOM_TRUSTED_PROXY_TOKEN:-}
      INQUIRY_PRIVACY_CONTROLLER: ${INQUIRY_PRIVACY_CONTROLLER:-}
      INQUIRY_PRIVACY_EMAIL: ${INQUIRY_PRIVACY_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dependencies
    command: ["bun", "run", "dev"]
    ports:
      - "127.0.0.1:${ECOM_APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://market_entry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}@db:5432/market_entry
    depends_on:
      db:
        condition: service_healthy
  retention:
    profiles: ["retention"]
    build:
      context: .
      target: maintenance
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["bun", "run", "db:retention:scheduler"]
    environment:
      ECOM_RETENTION_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "db:retention:monitor"]
      interval: 5m
      timeout: 15s
      start_period: 2m
      retries: 2
  mail:
    profiles: ["mail"]
    build:
      context: .
      target: maintenance
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["bun", "run", "mail:scheduler"]
    environment:
      DATABASE_URL: postgres://market_entry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}@db:5432/market_entry
      ECOM_MAIL_TRANSPORT: ${ECOM_MAIL_TRANSPORT:-log}
      ECOM_MAIL_FROM: ${ECOM_MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ECOM_STEWARD_NOTIFY_EMAIL: ${ECOM_STEWARD_NOTIFY_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "mail:flush", "--dry-run"]
      interval: 5m
      timeout: 15s
      start_period: 1m
      retries: 2
  db:
    image: postgis/postgis:16-3.4
    container_name: ${ECOM_DB_CONTAINER:-vietnam-investor-platform-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_entry
      POSTGRES_USER: market_entry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:${ECOM_DB_PORT:-55432}:5432"
    volumes:
      - market_entry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_entry -d market_entry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market_entry_pgdata:
