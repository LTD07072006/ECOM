name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: Required release checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      REQUIRE_RELEASE_APPROVAL: "0"
      ECOM_ALLOW_DIRECT_INGRESS: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      INQUIRY_PRIVACY_CONTROLLER: ECOM test operator
      INQUIRY_PRIVACY_EMAIL: privacy@example.test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - name: Start disposable PostgreSQL and generate test tokens
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          steward="$(openssl rand -hex 32)"
          reviewer="$(openssl rand -hex 32)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$steward"
          echo "::add-mask::$reviewer"
          docker run -d --name ecom-release-db -p 127.0.0.1::5432 -e POSTGRES_PASSWORD \
            -e POSTGRES_USER=market_entry -e POSTGRES_DB=ecom_inquiry_it_ci \
            postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          timeout 90 bash -c 'until docker exec ecom-release-db pg_isready -h 127.0.0.1 -U market_entry -d ecom_inquiry_it_ci; do sleep 1; done'
          docker exec ecom-release-db createdb -U market_entry ecom_sprint4_workflow_ci
          port="$(docker port ecom-release-db 5432/tcp)"
          base="postgresql://market_entry:$POSTGRES_PASSWORD@$port"
          {
            echo "DATABASE_URL=$base/ecom_inquiry_it_ci"
            echo "WORKFLOW_DATABASE_URL=$base/ecom_sprint4_workflow_ci"
            echo "RELEASE_STEWARD_TOKEN=$steward"
            echo "RELEASE_REVIEWER_TOKEN=$reviewer"
            echo "E2E_RELEASE_STEWARD_TOKEN=$steward"
            echo "E2E_RELEASE_REVIEWER_TOKEN=$reviewer"
            echo "ECOM_OPERATORS=[{\"id\":\"ci-steward\",\"role\":\"steward\",\"token\":\"$steward\"},{\"id\":\"ci-reviewer\",\"role\":\"reviewer\",\"token\":\"$reviewer\"}]"
          } >> "$GITHUB_ENV"
      - name: Apply migrations and load published data
        run: |
          bun run db:migrate
          bun run db:import --publish
          bun run db:import:wave2 --publish
          bun run db:check
      - name: Check Drizzle schema and migrations are in sync
        run: |
          bun run db:generate
          test -z "$(git status --porcelain -- drizzle)"
      - name: Run unit tests and required PostGIS integration
        run: ECOM_OPERATORS= bun run test:release db
      - name: Test publish and retire on a separate database
        run: |
          export DATABASE_URL="$WORKFLOW_DATABASE_URL" REQUIRE_RELEASE_APPROVAL=1 ECOM_OPERATORS=
          bun run db:migrate
          bun run db:import --stage
          bun run test:release workflow
      - name: Compile production
        run: bun run build
      - name: Install Chromium
        run: bun x --no-install playwright install --with-deps chromium
      - name: Run all required browser tests against production
        run: |
          bun run start --hostname 127.0.0.1 > "$RUNNER_TEMP/ecom-server.log" 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl --silent --fail "$E2E_BASE_URL/api/health" | jq -e ".status == \"ok\" and .publicationStatus == \"published\"" >/dev/null; do sleep 1; done'
          bun run test:pilot "$E2E_BASE_URL" 5
          bun run test:release e2e
      - name: Build production and maintenance container images
        run: |
          docker build --target production -t ecom-app:ci .
          docker build --target maintenance -t ecom-maint:ci .
      - name: Smoke-test production and maintenance containers
        run: |
          docker run -d --name ecom-app-ci --network host \
            -e PORT=3100 -e HOSTNAME=127.0.0.1 \
            -e DATABASE_URL -e ECOM_ALLOW_DIRECT_INGRESS=1 \
            ecom-app:ci
          timeout 60 bash -c 'until curl --silent --fail "http://127.0.0.1:3100/api/health" | jq -e ".status == \"ok\" and .publicationStatus == \"published\"" >/dev/null; do sleep 1; done'
          test "$(docker exec ecom-app-ci id -u)" != "0"
          set +e
          monitor_out="$(docker run --rm --network host -e DATABASE_URL ecom-maint:ci bun run db:retention:monitor)"
          monitor_status=$?
          set -e
          test "$monitor_status" -eq 0 -o "$monitor_status" -eq 1
          printf '%s\n' "$monitor_out" | grep -q '"retention_health"'
      - name: Stop smoke container
        if: always()
        run: docker rm -f ecom-app-ci || true
      - name: Scan production container image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 ecom-app:ci
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f ecom-release-db || true
