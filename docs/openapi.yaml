openapi: 3.1.0
info:
  title: ECOM API
  version: 1.1.0
  description: >-
    Public geographic context, decision evidence, and investor inquiry APIs,
    plus authenticated steward and reviewer internal APIs.
    All public reference values reflect the currently published administrative release.
servers:
  - url: http://127.0.0.1:3000
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: Individual operator Bearer token configured via ECOM_OPERATORS.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ecom_operator_session
      description: Short-lived signed HttpOnly; SameSite=Strict session cookie issued by POST /api/internal/session.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}
        fields: {type: array, items: {type: string}}
    HealthResponse:
      type: object
      required: [status, database, mode, publicationStatus]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ready, unavailable]}
        mode: {type: string, enum: [database, unavailable]}
        publicationStatus: {type: string, enum: [published, unpublished, unavailable]}
    Geography:
      type: object
      required: [id, code, name, displayName, level, geographyVersion, geometryStatus]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        displayName: {type: string}
        level: {type: string, enum: [country, province, commune]}
        parentId: {type: [string, 'null'], format: uuid}
        parentName: {type: [string, 'null']}
        geographyVersion: {type: string}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
        geometryStatus: {type: string, enum: [boundary_verified, point_only, not_available]}
    Observation:
      type: object
      required: [id, geoId, indicator, label, value, unit, period, quality, scoreEligible, datasetVersion, source]
      properties:
        id: {type: string}
        geoId: {type: string, format: uuid}
        indicator: {type: string}
        label: {type: string}
        definition: {type: string}
        value: {type: [number, 'null']}
        unit: {type: string}
        period: {type: string}
        periodStart: {type: string}
        periodEnd: {type: string}
        scope: {type: string}
        quality: {type: string, enum: [verified, supported, unavailable]}
        missingReason: {type: [string, 'null']}
        scoreEligible: {type: boolean}
        datasetVersion: {type: string}
        source: {type: object}
    Profile:
      allOf:
        - {$ref: '#/components/schemas/Geography'}
        - type: object
          required: [observations]
          properties:
            observations: {type: array, items: {$ref: '#/components/schemas/Observation'}}
    ComparisonResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [profiles, comparison]
          properties:
            profiles: {type: array, items: {$ref: '#/components/schemas/Profile'}}
            comparison:
              type: object
              required: [compatible, rows]
              properties:
                compatible: {type: boolean}
                reason: {type: [string, 'null']}
                rows: {type: array, items: {type: object}}
        meta:
          type: object
          properties:
            dataStatus: {type: string}
            availablePeriods: {type: array, items: {type: string}}
            selectedPeriod: {type: [string, 'null']}
    SurveyEvidenceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, studies]
          properties:
            status: {type: string, enum: [available, unavailable]}
            reason: {type: [string, 'null']}
            studies: {type: array, items: {type: object}}
        meta: {type: object}
    InquiryCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [referenceCode]
          properties:
            referenceCode: {type: string, pattern: '^INQ-\d{4}-[A-F0-9]{8}$'}
    InquiryStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [referenceCode, status, createdAt, updatedAt, anonymized, timeline]
          properties:
            referenceCode: {type: string}
            status: {type: string, enum: [new, contacted, qualified, closed]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            anonymized: {type: boolean}
            timeline: {type: array, items: {type: object}}
    SessionStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [authenticated]
          properties:
            authenticated: {type: boolean}
            actor: {type: [string, 'null']}
            role: {type: [string, 'null'], enum: [steward, reviewer, null]}
    SnapshotResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            snapshot_id: {type: string, format: uuid}
            period_start: {type: string, format: date-time}
            period_end: {type: string, format: date-time}
            time_zone: {type: string, default: Asia/Ho_Chi_Minh}
            formula_version: {type: string, default: inquiry-funnel-v4}
            metrics: {type: object}
    ReleaseOverviewResponse:
      type: object
      required: [role, actor, data]
      properties:
        role: {type: string, enum: [steward, reviewer]}
        actor: {type: string}
        data: {type: object}
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: A valid operator token or session cookie with the required role is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    MethodNotAllowed:
      description: Method is not permitted on this immutable or audited endpoint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooManyRequests:
      description: Per-client or route emergency quota exceeded.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: The published catalog or database is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
paths:
  /api/health:
    get:
      summary: Published catalog and database readiness status
      responses:
        '200':
          description: Lightweight database and publication status without scanning geo_units.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/geographies:
    get:
      summary: Search published places with optional level, period, quality, and numeric indicator filters
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, minLength: 2, maxLength: 120}}
        - {name: level, in: query, schema: {type: string, enum: [country, province, commune]}}
        - {name: indicator, in: query, schema: {type: string}, description: Published indicator code used with numeric/period/quality filters.}
        - {name: period, in: query, schema: {type: string, maxLength: 32}, description: Optional period label (e.g. 2025).}
        - {name: quality, in: query, schema: {type: string, enum: [verified, supported]}}
        - {name: min, in: query, schema: {type: number}, description: Inclusive lower numeric threshold.}
        - {name: max, in: query, schema: {type: number}, description: Inclusive upper numeric threshold.}
      responses:
        '200':
          description: Matching places, dataset provenance, and transparent numericFilter exclusion counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Geography'}}
                  meta: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/geographies/batch:
    get:
      summary: Fetch between 1 and 20 published place profiles in one request
      parameters:
        - {name: ids, in: query, required: true, schema: {type: string}, description: Comma-separated unique UUIDs (1 to 20).}
      responses:
        '200':
          description: Resolved place profiles with observations and provenance.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Profile'}}
                  meta: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/geographies/{geoId}:
    get:
      summary: Published place profile, observations, and time-series history
      parameters:
        - {name: geoId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Profile with indicator provenance, quality, and multi-period history.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
                  meta: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/geographies/compare:
    get:
      summary: Compare two or three published places using coherent common cohorts
      parameters:
        - {name: ids, in: query, required: true, schema: {type: string}, description: Comma-separated unique UUIDs (2 to 3).}
        - {name: period, in: query, required: false, schema: {type: string, maxLength: 32}, description: Optional period label to pin cohort comparison.}
      responses:
        '200':
          description: Profiles, row-level compatibility comparison, and available cohort periods.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/geographies/export:
    get:
      summary: Export up to twenty places as JSON or formula-safe UTF-8 CSV
      parameters:
        - {name: ids, in: query, required: true, schema: {type: string}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [json, csv]}}
      responses:
        '200':
          description: JSON or UTF-8 CSV including provenance and quality metadata.
          content:
            application/json:
              schema: {type: object}
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/decision/evidence:
    get:
      summary: Query published customer needs/wants survey studies and aggregates (F04/T04)
      parameters:
        - {name: sector, in: query, required: false, schema: {type: string, enum: [retail, manufacturing, logistics, enterprise]}}
        - {name: geoIds, in: query, required: false, schema: {type: string}, description: Optional comma-separated province UUIDs (up to 10).}
      responses:
        '200':
          description: Published survey studies or explicit unavailable state when no study exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurveyEvidenceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/map/provinces:
    get:
      summary: Published provincial boundaries (GeoJSON)
      responses:
        '200':
          description: GeoJSON feature collection and dataset metadata with ETag and Cache-Control.
          content:
            application/json:
              schema: {type: object}
        '304': {description: Not modified when If-None-Match matches the current boundary release ETag.}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/map/layers:
    get:
      summary: Published indicator and infrastructure layers
      responses:
        '200':
          description: Layers with source, version, value quality and provenance, plus ETag and Cache-Control.
          content:
            application/json:
              schema: {type: object}
        '304': {description: Not modified when If-None-Match matches the current layers ETag.}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/inquiries:
    post:
      summary: Submit a public investor inquiry (<= 64 KB bounded stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message, consent, noticeVersion]
              properties:
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, minLength: 10, maxLength: 5000}
                name: {type: string, maxLength: 160}
                organization: {type: string, maxLength: 200}
                country: {type: string, maxLength: 100}
                sector: {type: string, maxLength: 160}
                geographyIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
                consent: {const: true}
                noticeVersion: {const: inquiry-privacy-v1}
                honeypot: {const: ''}
      responses:
        '201':
          description: Inquiry stored and reference code returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InquiryCreatedResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {description: Request exceeds the 64 KB byte limit.}
        '415': {description: Unsupported Content-Type (application/json required).}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/inquiries/status:
    post:
      summary: Look up public handling status for an inquiry using reference code and submission email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referenceCode, email]
              properties:
                referenceCode: {type: string, pattern: '^INQ-\d{4}-[A-F0-9]{8}$'}
                email: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: Non-sensitive handling progress and public status milestones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InquiryStatusResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/internal/session:
    get:
      summary: Check current authenticated operator session
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Session status and active actor/role if signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStatusResponse'}
    post:
      summary: Exchange an operator token for a short-lived HttpOnly SameSite=Strict session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1}
      responses:
        '200':
          description: Signed HttpOnly session cookie issued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStatusResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      summary: Clear the operator session cookie (sign out)
      responses:
        '200':
          description: Session cookie cleared.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStatusResponse'}
  /api/internal/inquiries:
    get:
      summary: Steward inquiry list, SQL-aggregated funnel metrics, or bounded streaming CSV export
      security: [{operatorToken: []}, {cookieAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, contacted, qualified, closed]}}
        - {name: country, in: query, schema: {type: string, maxLength: 100}}
        - {name: sector, in: query, schema: {type: string, maxLength: 160}}
        - {name: reference, in: query, schema: {type: string, maxLength: 32}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: geographyIds, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: format, in: query, schema: {type: string, enum: [csv]}}
      responses:
        '200':
          description: Filtered inquiry list and SQL metrics, or streaming safe CSV (max 5,000 rows).
          content:
            application/json:
              schema: {type: object}
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Matching inquiry count exceeds synchronous CSV limit (5,000 rows).}
  /api/internal/inquiries/{referenceCode}:
    parameters:
      - {name: referenceCode, in: path, required: true, schema: {type: string}}
    get:
      summary: Steward inquiry detail and audit history
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Inquiry detail, provenance and audit events.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Record status transition or internal note
      security: [{operatorToken: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [new, contacted, qualified, closed]}
                closeReason: {type: string, enum: [spam, duplicate, out_of_scope, resolved]}
                note: {type: string, minLength: 1, maxLength: 5000}
      responses:
        '200':
          description: Updated and audited.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Invalid status transition.}
        '413': {description: Request body exceeds 32 KB.}
  /api/internal/inquiries/snapshots:
    get:
      summary: List stored immutable report snapshots
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Snapshot list.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Preview or create a report snapshot (defaults to Asia/Ho_Chi_Minh)
      security: [{operatorToken: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodStart, periodEnd, filters]
              properties:
                periodStart: {type: string, format: date-time}
                periodEnd: {type: string, format: date-time}
                timeZone: {type: string, default: Asia/Ho_Chi_Minh}
                correctsSnapshotId: {type: string, format: uuid}
                preview: {type: boolean}
                filters:
                  type: object
                  properties:
                    status: {type: string, enum: [new, contacted, qualified, closed]}
                    country: {type: string}
                    sector: {type: string}
                    referenceCode: {type: string}
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                    geographyIds: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Preview count.
          content:
            application/json:
              schema: {type: object}
        '201':
          description: Stored snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      summary: Rejected — snapshots are immutable
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
    delete:
      summary: Rejected — snapshots are deleted only by retention cleanup
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/internal/inquiries/snapshots/{snapshotId}:
    parameters:
      - {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get stored snapshot and audit log (read-only)
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Stored snapshot and audit entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Rejected — snapshots are immutable
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
    delete:
      summary: Rejected — snapshots are deleted only by retention cleanup
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/internal/inquiries/snapshots/export:
    get:
      summary: Rejected — audited exports require POST
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
    post:
      summary: Download and audit a stored snapshot as CSV
      security: [{operatorToken: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
      responses:
        '200':
          description: Formula-safe snapshot CSV.
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/internal/inquiries/snapshots/compare:
    get:
      summary: Rejected — audited comparisons require POST
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
    post:
      summary: Compare and audit two compatible snapshots
      security: [{operatorToken: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [left, right], properties: {left: {type: string, format: uuid}, right: {type: string, format: uuid}}}
      responses:
        '200':
          description: Side-by-side totals and differences.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Incompatible report conditions (filters, timeZone, or formulaVersion).}
  /api/internal/releases:
    get:
      summary: Reviewer or steward release overview
      security: [{operatorToken: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Dataset batches, blockers, and audit trail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseOverviewResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Approve (reviewer), publish or retire (steward) a release batch
      security: [{operatorToken: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, action, note]
              properties:
                batchId: {type: string, format: uuid}
                action: {type: string, enum: [approve, publish, retire]}
                note: {type: string, minLength: 10, maxLength: 500}
      responses:
        '200':
          description: Action recorded and audited.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Operator role cannot perform this action.}
        '409': {description: Batch state does not permit this transition.}
